<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Числовая Головоломка</title>
    
    <!-- VK Play JS API -->
    <script type="text/javascript" src="//vkplay.ru/app/45886/static/mailru.core.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            font-family: 'Arial', sans-serif;
            background: #FAF8EF;
            color: #776E65;
            touch-action: manipulation;
        }

        .game-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .game-title {
            font-size: 40px;
            font-weight: bold;
            color: #776E65;
            margin-bottom: 10px;
        }

        .scores-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .score-box {
            background: #BBADA0;
            padding: 10px 15px;
            border-radius: 5px;
            text-align: center;
            min-width: 80px;
        }

        .score-label {
            color: #EEE4DA;
            font-size: 12px;
        }

        .score-value {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .game-grid {
            background: #BBADA0;
            border-radius: 10px;
            padding: 10px;
            position: relative;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            aspect-ratio: 1;
        }

        .grid-cell {
            background: #CDC1B4;
            border-radius: 5px;
        }

        .tile {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 5px;
            transition: all 0.15s ease;
            z-index: 2;
        }

        .tile-2 { background: #EEE4DA; color: #776E65; }
        .tile-4 { background: #EDE0C8; color: #776E65; }
        .tile-8 { background: #F2B179; color: white; }
        .tile-16 { background: #F59563; color: white; }
        .tile-32 { background: #F67C5F; color: white; }
        .tile-64 { background: #F65E3B; color: white; }
        .tile-128 { background: #EDCF72; color: white; font-size: 20px; }
        .tile-256 { background: #EDCC61; color: white; font-size: 20px; }
        .tile-512 { background: #EDC850; color: white; font-size: 20px; }
        .tile-1024 { background: #EDC53F; color: white; font-size: 18px; }
        .tile-2048 { background: #EDC22E; color: white; font-size: 18px; }

        .controls {
            text-align: center;
            margin-bottom: 20px;
        }

        .new-game-btn {
            background: #8F7A66;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .shop-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .instructions {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #776E65;
        }

        /* Стили для магазина */
        .shop-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .shop-content {
            background: #faf8ef;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .shop-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .coin-balance {
            font-size: 18px;
            font-weight: bold;
            color: #bbada0;
            margin: 10px 0;
        }

        .shop-tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 2px solid #bbada0;
        }

        .shop-tabs button {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
        }

        .shop-tabs .tab-active {
            border-bottom: 3px solid #8f7a66;
            font-weight: bold;
        }

        .product {
            display: flex;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .product:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .product-icon {
            font-size: 24px;
            margin-right: 15px;
        }

        .product-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .product-price {
            color: #8f7a66;
            font-size: 16px;
        }

        .product-bonus {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 2px;
        }

        .hidden {
            display: none;
        }

        .close-btn {
            background: #f65e3b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }

        /* Стили для статуса платежа */
        .payment-status {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            margin: 10px 0;
        }

        .payment-success {
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
        }

        .payment-error {
            color: #f65e3b;
            font-size: 18px;
            font-weight: bold;
        }

        .payment-processing {
            color: #8f7a66;
            font-size: 16px;
        }

        /* Стили для VK Play оверлея */
        .vkplay-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }

        .vkplay-frame {
            width: 90%;
            height: 80%;
            max-width: 400px;
            max-height: 600px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        @media (max-width: 500px) {
            .game-title {
                font-size: 32px;
            }
            
            .tile {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="game-title">2048 - Числовая Головоломка</div>
        </div>

        <div class="scores-container">
            <div class="score-box">
                <div class="score-label">СЧЕТ</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">РЕКОРД</div>
                <div class="score-value" id="best-score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">ХОДЫ</div>
                <div class="score-value" id="moves">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">МОНЕТЫ</div>
                <div class="score-value" id="coin-count">0</div>
            </div>
        </div>

        <div class="game-grid">
            <div class="grid-container" id="grid-container"></div>
        </div>

        <div class="controls">
            <button class="new-game-btn" id="new-game-btn">Новая Игра</button>
            <button class="shop-btn" id="shop-btn">Магазин 🛒</button>
        </div>

        <div class="instructions">
            Управление: стрелки или WASD • R - перезапуск
        </div>
    </div>

    <!-- Модальное окно магазина -->
    <div id="shop-modal" class="shop-modal">
        <div class="shop-content">
            <div class="shop-header">
                <h2>🛒 Магазин</h2>
                <div class="coin-balance">
                    Ваши монеты: <span id="shop-coin-count">0</span> 🪙
                </div>
            </div>
            
            <div class="shop-tabs">
                <button class="tab-active" onclick="switchTab('coins')">Купить монеты</button>
                <button onclick="switchTab('items')">Покупки за монеты</button>
            </div>
            
            <!-- Вкладка покупки монет -->
            <div id="coins-tab" class="tab-content">
                <div class="product" onclick="startVKPlayPurchase('coins_100')">
                    <div class="product-icon">🪙</div>
                    <div class="product-info">
                        <div class="product-title">100 монет</div>
                        <div class="product-price">30 ₽</div>
                    </div>
                </div>
                
                <div class="product" onclick="startVKPlayPurchase('coins_500')">
                    <div class="product-icon">💰</div>
                    <div class="product-info">
                        <div class="product-title">500 монет</div>
                        <div class="product-price">149 ₽</div>
                        <div class="product-bonus">Выгода 50 монет!</div>
                    </div>
                </div>
                
                <div class="product" onclick="startVKPlayPurchase('coins_1200')">
                    <div class="product-icon">💎</div>
                    <div class="product-info">
                        <div class="product-title">1200 монет</div>
                        <div class="product-price">299 ₽</div>
                        <div class="product-bonus">Выгода 300 монет!</div>
                    </div>
                </div>
            </div>
            
            <!-- Вкладка товаров за монеты -->
            <div id="items-tab" class="tab-content hidden">
                <div class="product" onclick="buyWithCoins('undo_5')">
                    <div class="product-icon">↩️</div>
                    <div class="product-info">
                        <div class="product-title">5 отмен хода</div>
                        <div class="product-price">100 🪙</div>
                    </div>
                </div>
                
                <div class="product" onclick="buyWithCoins('hint_3')">
                    <div class="product-icon">💡</div>
                    <div class="product-info">
                        <div class="product-title">3 подсказки</div>
                        <div class="product-price">150 🪙</div>
                    </div>
                </div>
                
                <div class="product" onclick="buyWithCoins('special_theme')">
                    <div class="product-icon">🎨</div>
                    <div class="product-info">
                        <div class="product-title">Особая тема</div>
                        <div class="product-price">300 🪙</div>
                    </div>
                </div>
            </div>

            <!-- Статус платежа -->
            <div id="payment-status" class="payment-status hidden"></div>

            <button class="close-btn" onclick="hideShop()">Закрыть</button>
        </div>
    </div>

    <!-- VK Play оверлей для платежей -->
    <div id="vkplay-overlay" class="vkplay-overlay">
        <div class="vkplay-frame" id="vkplay-frame">
            <!-- Здесь будет отображаться платежное окно VK Play -->
        </div>
    </div>

    <script>
        // =============================================================================
        // VK PLAY JS API INTEGRATION
        // =============================================================================

        class VKPlayIntegration {
            constructor() {
                this.isInitialized = false;
                this.products = {
                    "coins_100": {
                        id: "coins_100",
                        title: "100 монет",
                        price: 30,
                        coins: 100,
                        description: "Пакет 100 игровых монет"
                    },
                    "coins_500": {
                        id: "coins_500",
                        title: "500 монет",
                        price: 149,
                        coins: 500,
                        description: "Пакет 500 игровых монет"
                    },
                    "coins_1200": {
                        id: "coins_1200",
                        title: "1200 монет",
                        price: 299,
                        coins: 1200,
                        description: "Пакет 1200 игровых монет"
                    }
                };
                
                this.init();
            }

            async init() {
                try {
                    // Инициализация VK Play JS API
                    if (typeof mailru !== 'undefined' && mailru.core) {
                        await this.initializeVKPlayAPI();
                        this.isInitialized = true;
                        console.log('✅ VK Play JS API инициализирован');
                    } else {
                        console.warn('⚠️ VK Play JS API не загружен, используется тестовый режим');
                        this.setupTestMode();
                    }
                } catch (error) {
                    console.error('❌ Ошибка инициализации VK Play:', error);
                    this.setupTestMode();
                }
            }

            async initializeVKPlayAPI() {
                return new Promise((resolve, reject) => {
                    mailru.core.init({
                        appId: 45886, // Ваш app_id
                        onInit: (response) => {
                            if (response.success) {
                                console.log('🚀 VK Play API успешно инициализирован');
                                resolve(response);
                            } else {
                                reject(new Error('Ошибка инициализации VK Play API'));
                            }
                        }
                    });
                });
            }

            setupTestMode() {
                console.log('🔧 Активирован тестовый режим платежей');
                // В тестовом режиме эмулируем API
                window.vkPlayPayments = {
                    showPayment: (productId) => this.processTestPayment(productId)
                };
            }

            // Основной метод покупки через VK Play
            async startPurchase(productId) {
                const product = this.products[productId];
                if (!product) {
                    this.showPaymentStatus('error', 'Продукт не найден');
                    return;
                }

                try {
                    this.showPaymentStatus('processing', 'Подготовка платежа...');

                    if (this.isInitialized && typeof mailru !== 'undefined') {
                        // Реальный платеж через VK Play
                        await this.processVKPlayPayment(productId, product);
                    } else {
                        // Тестовый платеж
                        await this.processTestPayment(productId, product);
                    }

                } catch (error) {
                    console.error('❌ Ошибка платежа:', error);
                    this.showPaymentStatus('error', 'Ошибка при обработке платежа');
                }
            }

            // Обработка реального платежа через VK Play
            async processVKPlayPayment(productId, product) {
                return new Promise((resolve, reject) => {
                    mailru.payments.showPayment({
                        item: productId,
                        onSuccess: (response) => {
                            console.log('✅ Платеж успешен:', response);
                            this.handleSuccessfulPayment(productId);
                            this.showPaymentStatus('success', `Успешно! Получено ${product.coins} монет!`);
                            resolve(response);
                        },
                        onError: (error) => {
                            console.error('❌ Ошибка платежа:', error);
                            this.showPaymentStatus('error', 'Платеж не завершен');
                            reject(error);
                        },
                        onCancel: () => {
                            console.log('⚠️ Платеж отменен пользователем');
                            this.showPaymentStatus('error', 'Платеж отменен');
                            resolve(null);
                        }
                    });
                });
            }

            // Тестовый платеж для разработки
            async processTestPayment(productId, product) {
                return new Promise((resolve) => {
                    const confirmed = confirm(
                        `ТЕСТОВЫЙ РЕЖИМ ПЛАТЕЖА\n\n` +
                        `Товар: ${product.title}\n` +
                        `Цена: ${product.price} руб\n` +
                        `Описание: ${product.description}\n\n` +
                        `В реальной среде VK Play откроется платежное окно.\n\n` +
                        `Имитировать успешный платеж?`
                    );

                    if (confirmed) {
                        this.showPaymentStatus('processing', 'Обработка тестового платежа...');
                        
                        setTimeout(() => {
                            this.handleSuccessfulPayment(productId);
                            this.showPaymentStatus('success', `Успешно! Получено ${product.coins} монет! 🎉`);
                            resolve({ success: true });
                        }, 2000);
                    } else {
                        this.showPaymentStatus('error', 'Платеж отменен');
                        resolve(null);
                    }
                });
            }

            // Обработка успешного платежа
            handleSuccessfulPayment(productId) {
                const product = this.products[productId];
                if (product && product.coins) {
                    // Начисляем монеты
                    window.coinSystem.addCoins(product.coins);
                    
                    // Сохраняем историю покупок
                    this.savePurchaseHistory(productId);
                    
                    console.log('💰 Начислены монеты:', product.coins);
                }
            }

            // Сохранение истории покупок
            savePurchaseHistory(productId) {
                const purchases = JSON.parse(localStorage.getItem('vkplay_purchase_history') || '[]');
                purchases.push({
                    productId: productId,
                    date: new Date().toISOString(),
                    coins: this.products[productId].coins
                });
                localStorage.setItem('vkplay_purchase_history', JSON.stringify(purchases));
            }

            // Отображение статуса платежа
            showPaymentStatus(type, message) {
                const statusElement = document.getElementById('payment-status');
                if (!statusElement) return;

                statusElement.className = 'payment-status';
                statusElement.classList.remove('hidden');
                
                if (type === 'success') {
                    statusElement.innerHTML = `<div class="payment-success">✅ ${message}</div>`;
                } else if (type === 'error') {
                    statusElement.innerHTML = `<div class="payment-error">❌ ${message}</div>`;
                } else if (type === 'processing') {
                    statusElement.innerHTML = `<div class="payment-processing">⏳ ${message}</div>`;
                }
                
                // Автоматическое скрытие через 5 секунд (кроме processing)
                if (type !== 'processing') {
                    setTimeout(() => {
                        statusElement.classList.add('hidden');
                    }, 5000);
                }
            }

            // Получение истории покупок
            getPurchaseHistory() {
                return JSON.parse(localStorage.getItem('vkplay_purchase_history') || '[]');
            }
        }

        // =============================================================================
        // СИСТЕМА МОНЕТ
        // =============================================================================

        class CoinSystem {
            constructor() {
                this.coins = parseInt(localStorage.getItem('2048-coins')) || 0;
            }
            
            addCoins(amount) {
                this.coins += amount;
                this.save();
                this.updateUI();
                return this.coins;
            }
            
            spendCoins(amount) {
                if (this.coins >= amount) {
                    this.coins -= amount;
                    this.save();
                    this.updateUI();
                    return true;
                }
                return false;
            }
            
            getBalance() {
                return this.coins;
            }
            
            save() {
                localStorage.setItem('2048-coins', this.coins);
            }
            
            updateUI() {
                const coinElements = document.querySelectorAll('#coin-count, #shop-coin-count');
                coinElements.forEach(element => {
                    element.textContent = this.coins;
                });
            }
        }

        // =============================================================================
        // ТОВАРЫ ЗА МОНЕТЫ
        // =============================================================================

        const coinShopItems = {
            "undo_5": {
                title: "5 отмен хода",
                coins: 100,
                action: function() {
                    alert('✅ Добавлено 5 отмен хода!');
                }
            },
            "hint_3": {
                title: "3 подсказки", 
                coins: 150,
                action: function() {
                    alert('💡 Добавлено 3 подсказки!');
                }
            },
            "special_theme": {
                title: "Особая тема",
                coins: 300,
                action: function() {
                    alert('🎨 Особая тема разблокирована!');
                }
            }
        };

        // =============================================================================
        // ИГРА 2048
        // =============================================================================

        class Game2048 {
            constructor() {
                this.grid = [];
                this.score = 0;
                this.moves = 0;
                this.bestScore = localStorage.getItem('2048-best-score') || 0;
                this.size = 4;
                
                this.initialize();
            }

            initialize() {
                this.createGrid();
                this.updateDisplay();
                this.addRandomTile();
                this.addRandomTile();
                this.setupEventListeners();
            }

            createGrid() {
                const gridContainer = document.getElementById('grid-container');
                gridContainer.innerHTML = '';
                
                this.grid = Array(this.size).fill().map(() => Array(this.size).fill(0));
                
                for (let i = 0; i < this.size * this.size; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    gridContainer.appendChild(cell);
                }
            }

            addRandomTile() {
                const emptyCells = [];
                for (let row = 0; row < this.size; row++) {
                    for (let col = 0; col < this.size; col++) {
                        if (this.grid[row][col] === 0) {
                            emptyCells.push({ row, col });
                        }
                    }
                }

                if (emptyCells.length > 0) {
                    const { row, col } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    this.grid[row][col] = Math.random() < 0.9 ? 2 : 4;
                    this.createTileElement(row, col, this.grid[row][col]);
                }
            }

            createTileElement(row, col, value) {
                const tile = document.createElement('div');
                tile.className = `tile tile-${value}`;
                tile.textContent = value;
                
                const gridContainer = document.getElementById('grid-container');
                const cellSize = gridContainer.offsetWidth / this.size;
                
                tile.style.width = `${cellSize - 10}px`;
                tile.style.height = `${cellSize - 10}px`;
                tile.style.transform = `translate(${col * cellSize + 5}px, ${row * cellSize + 5}px)`;
                
                gridContainer.appendChild(tile);
            }

            setupEventListeners() {
                document.getElementById('new-game-btn').addEventListener('click', () => {
                    this.newGame();
                });

                document.getElementById('shop-btn').addEventListener('click', showShop);

                document.addEventListener('keydown', (event) => {
                    const key = event.key.toLowerCase();
                    
                    switch(key) {
                        case 'arrowup': case 'w': this.move('up'); break;
                        case 'arrowdown': case 's': this.move('down'); break;
                        case 'arrowleft': case 'a': this.move('left'); break;
                        case 'arrowright': case 'd': this.move('right'); break;
                        case 'r': this.newGame(); break;
                    }
                });

                // Добавляем свайпы для мобильных устройств
                this.setupSwipeListeners();
            }

            setupSwipeListeners() {
                let touchStartX, touchStartY;

                document.addEventListener('touchstart', (event) => {
                    touchStartX = event.touches[0].clientX;
                    touchStartY = event.touches[0].clientY;
                });

                document.addEventListener('touchend', (event) => {
                    if (!touchStartX || !touchStartY) return;

                    const touchEndX = event.changedTouches[0].clientX;
                    const touchEndY = event.changedTouches[0].clientY;

                    const diffX = touchStartX - touchEndX;
                    const diffY = touchStartY - touchEndY;

                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        if (diffX > 50) this.move('left');
                        else if (diffX < -50) this.move('right');
                    } else {
                        if (diffY > 50) this.move('up');
                        else if (diffY < -50) this.move('down');
                    }

                    touchStartX = null;
                    touchStartY = null;
                });
            }

            move(direction) {
                let moved = false;

                switch(direction) {
                    case 'up': moved = this.moveUp(); break;
                    case 'down': moved = this.moveDown(); break;
                    case 'left': moved = this.moveLeft(); break;
                    case 'right': moved = this.moveRight(); break;
                }

                if (moved) {
                    this.moves++;
                    
                    // Начисляем монеты за ходы
                    if (this.moves % 10 === 0) {
                        window.coinSystem.addCoins(1);
                    }
                    
                    this.updateTiles();
                    setTimeout(() => {
                        this.addRandomTile();
                        this.updateDisplay();
                        this.checkGameOver();
                    }, 150);
                }
                
                return moved;
            }

            moveUp() {
                let moved = false;
                for (let col = 0; col < this.size; col++) {
                    for (let row = 1; row < this.size; row++) {
                        if (this.grid[row][col] !== 0) {
                            let newRow = row;
                            while (newRow > 0 && this.grid[newRow - 1][col] === 0) {
                                this.grid[newRow - 1][col] = this.grid[newRow][col];
                                this.grid[newRow][col] = 0;
                                newRow--;
                                moved = true;
                            }
                            if (newRow > 0 && this.grid[newRow - 1][col] === this.grid[newRow][col]) {
                                this.grid[newRow - 1][col] *= 2;
                                this.grid[newRow][col] = 0;
                                this.score += this.grid[newRow - 1][col];
                                moved = true;
                            }
                        }
                    }
                }
                return moved;
            }

            moveDown() {
                let moved = false;
                for (let col = 0; col < this.size; col++) {
                    for (let row = this.size - 2; row >= 0; row--) {
                        if (this.grid[row][col] !== 0) {
                            let newRow = row;
                            while (newRow < this.size - 1 && this.grid[newRow + 1][col] === 0) {
                                this.grid[newRow + 1][col] = this.grid[newRow][col];
                                this.grid[newRow][col] = 0;
                                newRow++;
                                moved = true;
                            }
                            if (newRow < this.size - 1 && this.grid[newRow + 1][col] === this.grid[newRow][col]) {
                                this.grid[newRow + 1][col] *= 2;
                                this.grid[newRow][col] = 0;
                                this.score += this.grid[newRow + 1][col];
                                moved = true;
                            }
                        }
                    }
                }
                return moved;
            }

            moveLeft() {
                let moved = false;
                for (let row = 0; row < this.size; row++) {
                    for (let col = 1; col < this.size; col++) {
                        if (this.grid[row][col] !== 0) {
                            let newCol = col;
                            while (newCol > 0 && this.grid[row][newCol - 1] === 0) {
                                this.grid[row][newCol - 1] = this.grid[row][newCol];
                                this.grid[row][newCol] = 0;
                                newCol--;
                                moved = true;
                            }
                            if (newCol > 0 && this.grid[row][newCol - 1] === this.grid[row][newCol]) {
                                this.grid[row][newCol - 1] *= 2;
                                this.grid[row][newCol] = 0;
                                this.score += this.grid[row][newCol - 1];
                                moved = true;
                            }
                        }
                    }
                }
                return moved;
            }

            moveRight() {
                let moved = false;
                for (let row = 0; row < this.size; row++) {
                    for (let col = this.size - 2; col >= 0; col--) {
                        if (this.grid[row][col] !== 0) {
                            let newCol = col;
                            while (newCol < this.size - 1 && this.grid[row][newCol + 1] === 0) {
                                this.grid[row][newCol + 1] = this.grid[row][newCol];
                                this.grid[row][newCol] = 0;
                                newCol++;
                                moved = true;
                            }
                            if (newCol < this.size - 1 && this.grid[row][newCol + 1] === this.grid[row][newCol]) {
                                this.grid[row][newCol + 1] *= 2;
                                this.grid[row][newCol] = 0;
                                this.score += this.grid[row][newCol + 1];
                                moved = true;
                            }
                        }
                    }
                }
                return moved;
            }

            updateTiles() {
                const tiles = document.querySelectorAll('.tile');
                tiles.forEach(tile => tile.remove());

                for (let row = 0; row < this.size; row++) {
                    for (let col = 0; col < this.size; col++) {
                        if (this.grid[row][col] !== 0) {
                            this.createTileElement(row, col, this.grid[row][col]);
                        }
                    }
                }
            }

            updateDisplay() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('moves').textContent = this.moves;
                document.getElementById('best-score').textContent = this.bestScore;

                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('2048-best-score', this.bestScore);
                }
            }

            checkGameOver() {
                // Проверка на завершение игры
                for (let row = 0; row < this.size; row++) {
                    for (let col = 0; col < this.size; col++) {
                        if (this.grid[row][col] === 0) return;
                        if (col < this.size - 1 && this.grid[row][col] === this.grid[row][col + 1]) return;
                        if (row < this.size - 1 && this.grid[row][col] === this.grid[row + 1][col]) return;
                    }
                }
                
                // Если дошли сюда, игра окончена
                setTimeout(() => {
                    alert('Игра окончена! Ваш счет: ' + this.score);
                }, 500);
            }

            newGame() {
                this.grid = Array(this.size).fill().map(() => Array(this.size).fill(0));
                this.score = 0;
                this.moves = 0;
                
                this.updateTiles();
                this.updateDisplay();
                
                this.addRandomTile();
                this.addRandomTile();
            }
        }

        // =============================================================================
        // ГЛОБАЛЬНЫЕ ФУНКЦИИ
        // =============================================================================

        let vkPlayIntegration;
        let coinSystem;
        let game;

        // Глобальные функции магазина
        function showShop() {
            document.getElementById('shop-modal').style.display = 'flex';
            coinSystem.updateUI();
        }

        function hideShop() {
            document.getElementById('shop-modal').style.display = 'none';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.add('hidden');
            });
            
            document.querySelectorAll('.shop-tabs button').forEach(btn => {
                btn.classList.remove('tab-active');
            });
            
            document.getElementById(tabName + '-tab').classList.remove('hidden');
            event.target.classList.add('tab-active');
        }

        function startVKPlayPurchase(productId) {
            if (vkPlayIntegration) {
                vkPlayIntegration.startPurchase(productId);
            } else {
                alert('⚠️ Платежная система не инициализирована');
            }
        }

        function buyWithCoins(itemId) {
            const item = coinShopItems[itemId];
            
            if (coinSystem.spendCoins(item.coins)) {
                item.action();
            } else {
                alert("❌ Недостаточно монет!");
                switchTab('coins');
            }
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Инициализация систем
            vkPlayIntegration = new VKPlayIntegration();
            coinSystem = new CoinSystem();
            game = new Game2048();

            // Обновление UI
            coinSystem.updateUI();

            console.log('🎮 Игра 2048 с VK Play интеграцией готова!');
        });
    </script>
