<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Callback - 2048 Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .debug {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            margin-top: 15px;
            word-break: break-all;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 2048 Game</h1>
        <h2>Обработка платежа...</h2>
        <div id="status">Пожалуйста, подождите</div>
        <div id="debug" class="debug"></div>
        <button onclick="window.close()">Закрыть окно</button>
    </div>

    <script>
        // Обработка callback от VK Play
        function processVKPlayCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const allParams = Object.fromEntries(urlParams);
            
            // Детальное логирование всех параметров
            console.log('📨 VK Play Callback получен');
            console.log('🔗 Полный URL:', window.location.href);
            console.log('📊 Все параметры:', allParams);
            
            const debugElement = document.getElementById('debug');
            debugElement.innerHTML = `
                <strong>📋 Полученные параметры:</strong><br>
                ${Object.entries(allParams).map(([key, value]) => 
                    `${key}: ${value}<br>`
                ).join('')}
                <br><strong>🔗 Полный URL:</strong><br>
                ${window.location.href}
            `;
            
            // Пытаемся определить параметры платежа (разные версии VK Play)
            const paymentId = urlParams.get('payment_id') || urlParams.get('paymentId') || urlParams.get('id');
            const status = urlParams.get('status') || urlParams.get('result') || urlParams.get('state');
            const orderId = urlParams.get('order_id') || urlParams.get('orderId') || urlParams.get('order');
            const productId = urlParams.get('product_id') || urlParams.get('item');
            
            const statusElement = document.getElementById('status');
            
            // Проверяем успешность платежа
            const isSuccess = status === 'success' || 
                             status === 'completed' || 
                             status === 'ok' ||
                             urlParams.get('success') === 'true' ||
                             urlParams.get('result') === 'success';
            
            if (isSuccess && paymentId) {
                statusElement.innerHTML = `
                    <div style="color: #4CAF50; font-size: 24px; margin: 20px 0;">
                        ✅ Платеж успешно завершен!
                    </div>
                    <p>ID платежа: ${paymentId}</p>
                    <p>Товар: ${productId || 'не указан'}</p>
                    <p>Спасибо за покупку! Монеты будут начислены автоматически.</p>
                `;
                
                // Сообщаем основному окну об успешном платеже
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'vkplay_payment_success',
                        paymentId: paymentId,
                        orderId: orderId,
                        productId: productId,
                        timestamp: new Date().toISOString()
                    }, '*');
                    console.log('📤 Отправлено сообщение в родительское окно');
                }
                
                // Сохраняем в localStorage для основного приложения
                localStorage.setItem('vkplay_last_payment', JSON.stringify({
                    success: true,
                    paymentId: paymentId,
                    orderId: orderId,
                    productId: productId,
                    timestamp: new Date().toISOString()
                }));
                
            } else if (status === 'failed' || status === 'error' || urlParams.get('error')) {
                statusElement.innerHTML = `
                    <div style="color: #f44336; font-size: 24px; margin: 20px 0;">
                        ❌ Платеж не прошел
                    </div>
                    <p>Ошибка: ${urlParams.get('error') || status || 'неизвестная ошибка'}</p>
                    <p>Попробуйте еще раз или обратитесь в поддержку.</p>
                `;
            } else {
                statusElement.innerHTML = `
                    <div style="color: #ff9800; font-size: 24px; margin: 20px 0;">
                        ⚠️ Статус платежа: ${status || 'неизвестен'}
                    </div>
                    <p>Пожалуйста, проверьте историю платежей в VK Play.</p>
                `;
            }
        }

        // Запускаем обработку при загрузке
        document.addEventListener('DOMContentLoaded', processVKPlayCallback);
        
        // Также слушаем сообщения от VK Play
        window.addEventListener('message', function(event) {
            console.log('📨 Получено сообщение:', event.data);
            if (event.data && event.data.type === 'payment_success') {
                const statusElement = document.getElementById('status');
                statusElement.innerHTML = `
                    <div style="color: #4CAF50; font-size: 24px; margin: 20px 0;">
                        ✅ Платеж успешно завершен!
                    </div>
                    <p>Спасибо за покупку!</p>
                `;
            }
        });
    </script>
</body>
</html>
