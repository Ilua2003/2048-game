<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Callback - 2048 Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 2048 Game</h1>
        <h2>Обработка платежа...</h2>
        <div id="status">Пожалуйста, подождите</div>
    </div>

    <script>
        // Обработка callback от VK Play
        function processVKPlayCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentId = urlParams.get('payment_id');
            const status = urlParams.get('status');
            const orderId = urlParams.get('order_id');
            
            console.log('VK Play Callback:', {
                paymentId,
                status,
                orderId,
                allParams: Object.fromEntries(urlParams)
            });

            const statusElement = document.getElementById('status');
            
            if (status === 'success' && paymentId) {
                statusElement.innerHTML = `
                    <div style="color: #4CAF50; font-size: 24px; margin: 20px 0;">
                        ✅ Платеж успешно завершен!
                    </div>
                    <p>ID платежа: ${paymentId}</p>
                    <p>Спасибо за покупку! Монеты будут начислены автоматически.</p>
                `;
                
                // Сообщаем основному окну об успешном платеже
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'vkplay_payment_success',
                        paymentId: paymentId,
                        orderId: orderId,
                        timestamp: new Date().toISOString()
                    }, '*');
                }
                
                // Сохраняем в localStorage для основного приложения
                localStorage.setItem('vkplay_last_payment', JSON.stringify({
                    success: true,
                    paymentId: paymentId,
                    orderId: orderId,
                    timestamp: new Date().toISOString()
                }));
                
            } else if (status === 'failed') {
                statusElement.innerHTML = `
                    <div style="color: #f44336; font-size: 24px; margin: 20px 0;">
                        ❌ Платеж не прошел
                    </div>
                    <p>Попробуйте еще раз или обратитесь в поддержку.</p>
                `;
            } else {
                statusElement.innerHTML = `
                    <div style="color: #ff9800; font-size: 24px; margin: 20px 0;">
                        ⚠️ Статус платежа неизвестен
                    </div>
                    <p>Пожалуйста, проверьте историю платежей.</p>
                `;
            }

            // Автоматическое закрытие через 5 секунд
            setTimeout(() => {
                window.close();
            }, 5000);
        }

        // Запускаем обработку при загрузке
        document.addEventListener('DOMContentLoaded', processVKPlayCallback);
    </script>
</body>
</html>
